name: FX Forward Test Cycle (Weekly, SYS-FX012 + SYS-FX026)

# 00-spec.md §「フォワードテスト仕様」§「監視サイクル」に基づく週次サイクル。
# cutoff 2026-08-15 06:00 JST 以降のデータを毎サイクルで再取得・再計算し、
# research/method-notes/sysfx012_forward_test_ledger.json を上書き commit/push する。
# 30/60/90 日チェックポイント (2026-09-14 / 10-14 / 11-13) の集計材料を更新する役割。
#
# 司令塔判断 (2026-08-22) で先行着手: 必須KPI 13/18 未達・C 品質レビュー未実施の
# まま、ペーパートレード (実発注なし) で開始。採用GOではない。
#
# 注: trading-app-v2 側の sysfx012-fx-forward-sync.yml (月曜 12:00 JST) は
# 本 workflow が commit した ledger を public/data/forward-fx-sysfx012/ へ
# コピーして公開 Web UI へ反映する役。両者は依存関係にある。
#
# 2026-08-28 追加: 司令塔判断「1のあと2へ」(EXP-FX000021 amendment-02) により
# SYS-FX026 をフォワードテストへ投入。同一の M5 データ取得を共有し、1 ジョブで
# 2 戦略分の ledger を更新する (sysfx012 / sysfx026)。run_forward_test_cycle.py は
# --strategy でパラメータ化済みで、既定 (sysfx012) は従来と完全に同一の出力を返す
# ことを回帰確認済み。ワークフロー名は変えたがファイル名は据え置き
# (trading-app-v2 の sysfx012-fx-forward-sync.yml が本 workflow に依存するため)。
#
# 2026-08-27 修正 (OBS000009 不具合2): M5データの永続先を data/curated/
# ds-1-forward.json (.gitignore対象、ランナー間で永続しない) から
# data/raw/ds-1-forward/*.csv (git管理) に変更。従来は cutoff 以降のデータが
# 実質「直近2日分のローリング窓」でしか蓄積されておらず、2026-08-19の
# N_BREAKOUTイベント3件を取りこぼしていた(詳細: OBS000009)。

on:
  schedule:
    # 月曜 00:00 UTC = 月曜 09:00 JST (spec §「監視サイクル」)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true で ledger のみ更新・commit/push スキップ"
        required: false
        default: "false"

permissions:
  contents: write   # ledger の commit/push に必要

concurrency:
  group: sysfx012-fx-forward-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout minmax-fx-day-trading-lab (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # 必要最小限: numpy / pandas / scipy
        # (run_forward_test_cycle.py は indicators.py の手書き実装を使うため
        #  pandas-ta は不要。GMO API を叩く fetch_m5_ohlcv.py も使うので requests も追加)
        run: |
          pip install --no-cache-dir "numpy>=1.26" "pandas>=2.1" "scipy>=1.11" requests

      # ---- ds-1.json の再生成 ----
      # data/curated/ds-1.json は .gitignore (479MB > GitHub 100MB) されているため
      # workflow 環境には存在しない。data/raw/ds-1/*.csv (個別 ~10MB 程度、
      # git 管理中) から aggregate_to_json() で再生成する。
      # OBS000007 B4 で「過去 ds-1.json を silently 上書き縮小する」バグを
      # 修正済み (allow_shrink フラグ + 比較処理)。今回は allow_shrink=False で実行。
      - name: Regenerate ds-1.json from raw CSV (warmup data)
        run: |
          PYTHONPATH=src python3 -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from fetch_ds1_ohlcv import aggregate_to_json
          result = aggregate_to_json(
              raw_dir=Path('data/raw/ds-1'),
              out_json=Path('data/curated/ds-1.json'),
              allow_shrink=False,
          )
          print(f'[OK] ds-1.json regenerated: {result}')
          "

      # ---- data/raw/ds-1-forward/*.csv のライブ更新 (M5 OHLCV) ----
      # (2026-08-26 追加): update-ds1-forward.yml の処理と同等。
      # 別 workflow だと Actions runner 間で working tree が共有されないため、
      # cycle 内でも同じ処理を実行して最新 M5 データを取り込む(hourly job が
      # 何らかの理由で失敗していた場合の冗長経路にもなる)。
      #
      # 2026-08-27 修正 (OBS000009 不具合2): 永続先を data/curated/ds-1-forward.json
      # (.gitignore対象、ランナー間で永続しない) から data/raw/ds-1-forward/*.csv
      # (git管理) に変更。ここで取得した分も明示的に commit/push する。
      - name: Fetch live M5 OHLCV and merge into data/raw/ds-1-forward/*.csv
        # 過去 2 日分 (昨日 + 今日) を GMO API から取得。
        # 既存 raw CSV の最新バー timestamp 以降のみ追記 (重複排除込み)。
        # 公開エンドポイントのみ、API キー不要。
        run: |
          PYTHONPATH=src python3 scripts/live_monitor/fetch_m5_ohlcv.py --all-pairs --lookback-days 2

      - name: Commit and push raw M5 CSV if changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ds-1-forward/
          if git diff --cached --quiet; then
            echo "raw CSV に変更なし、コミットをスキップ"
          else
            git commit -m "SYS-FX012 forward M5 OHLCV (weekly cycle fetch): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::git pull --rebase failed (conflict). Aborted raw CSV commit, continuing cycle."
            else
              git push origin main
            fi
          fi

      # ---- フォワードテスト cycle 実行 ----
      # load_m5_forward() が ds-1.json (warmup) + data/raw/ds-1-forward/*.csv (新規、
      # git管理・永続) を結合。cutoff 2026-08-15 06:00 JST 以降の H1 イベントを
      # 検出→filter→M5 シミュレーション。出力: research/method-notes/sysfx012_forward_test_ledger.json
      - name: Run SYS-FX012 forward test cycle
        run: |
          PYTHONPATH=src python3 scripts/forward_test/run_forward_test_cycle.py --strategy sysfx012

      # SYS-FX026 (EXP-FX000021): 同じ M5 データを共有して 2 戦略目を評価する。
      # Test 判定は B (部分的に再現、未達=K5m 2.56<3.0) で採用GOは未具申。
      # フォワードの目的はゲートを緩めずに実効nを本物の未見データで積むこと。
      - name: Run SYS-FX026 forward test cycle
        run: |
          PYTHONPATH=src python3 scripts/forward_test/run_forward_test_cycle.py --strategy sysfx026

      # ---- commit/push (dry_run でない場合のみ) ----
      - name: Commit and push ledger
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LEDGERS="research/method-notes/sysfx012_forward_test_ledger.json research/method-notes/sysfx026_forward_test_ledger.json"

          if git diff --quiet ${LEDGERS}; then
            echo "No change in ledgers, skip commit"
            exit 0
          fi

          # generated_at と決済済みトレード数を両戦略分まとめてコミットメッセージへ
          GEN=$(python3 -c "import json; print(json.load(open('research/method-notes/sysfx012_forward_test_ledger.json'))['generated_at'])")
          T12=$(python3 -c "import json; d=json.load(open('research/method-notes/sysfx012_forward_test_ledger.json')); print(d['backtest']['n_trades_closed'])")
          T26=$(python3 -c "import json; d=json.load(open('research/method-notes/sysfx026_forward_test_ledger.json')); print(d['backtest']['n_trades_closed'])")

          git add ${LEDGERS}
          git commit -m "chore(forward): FX forward test weekly cycle — closed trades sysfx012=${T12} sysfx026=${T26} (generated ${GEN})"

          # rebase して push (他ブランチ/手動 push との競合回避)
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::warning::git pull --rebase failed (conflict). Aborted. Will retry next scheduled run."
            exit 1
          fi
          git push origin main
          echo "[OK] committed and pushed FX forward test cycle (sysfx012 + sysfx026)"

      # 成果物のログ保存 (CI アーティファクト、30日保持)
      - name: Upload ledger as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-forward-cycle-${{ github.run_id }}
          path: |
            research/method-notes/sysfx012_forward_test_ledger.json
            research/method-notes/sysfx026_forward_test_ledger.json
          retention-days: 30
