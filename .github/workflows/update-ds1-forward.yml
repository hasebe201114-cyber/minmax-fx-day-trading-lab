name: SYS-FX012 Forward M5 OHLCV Live Update (Hourly)

# FX012 フォワードテスト用 M5 OHLCV を毎時 GMO API から取得し、
# data/curated/ds-1-forward.json を追記マージする。
#
# .gitignore で ds-1-forward.json は除外されているため commit しない
# (毎回 1.4MB+ の更新で履歴が膨らむのを回避)。
#
# フォワードテスト本体 (sysfx012-fx-forward-cycle.yml) は別途 weekly 実行で
# このファイルを読み込み、ledger の latest_bar_by_pair を最新化する。
#
# 2026-08-26 追加: latest_bar_by_pair が 08-24 16:25 JST で止まる問題の修正
# (live-ticker-poll.yml は bid/ask 気配値のみ取得で M5 OHLCV は更新していなかった)

on:
  schedule:
    # 毎時 5 分 (rate limit 余裕、Actions runner のジッタ吸収)
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read   # 読み取りのみ (ds-1-forward.json は .gitignore で除外)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout minmax-fx-day-trading-lab (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir pandas numpy

      - name: Fetch M5 OHLCV (last 2 days) and merge into ds-1-forward.json
        # 過去 2 日分 (昨日 + 今日、土日も含む) を GMO API から取得。
        # 既存 ds-1-forward.json の最新バー timestamp 以降のみ追記 (重複防止)。
        run: |
          PYTHONPATH=src python3 scripts/live_monitor/fetch_m5_ohlcv.py --all-pairs --lookback-days 2

      - name: Print summary (no commit; ds-1-forward.json is .gitignore'd)
        # 1.4MB+ の更新が毎回 commit されると履歴が膨らむため commit は行わない。
        # フォワードテスト本体 (cycle.yml) は最新ファイルを Actions runner 上で直接読む。
        run: |
          python3 -c "
          import json
          with open('data/curated/ds-1-forward.json') as f:
              d = json.load(f)
          print('=== ds-1-forward.json summary ===')
          print(f'generated_at: {d[\"generated_at\"]}')
          for pair, p in d.get('pairs', {}).items():
              print(f'  {pair:<8} n_bars={p[\"n_bars\"]:>5} end={p[\"end\"]}')"
