name: SYS-FX012 Forward M5 OHLCV Live Update (Hourly)

# FX012 フォワードテスト用 M5 OHLCV を毎時 GMO API から取得し、
# data/raw/ds-1-forward/*.csv (git 管理・永続) に追記マージして commit する。
#
# 2026-08-26 追加: latest_bar_by_pair が 08-24 16:25 JST で止まる問題の修正
# (live-ticker-poll.yml は bid/ask 気配値のみ取得で M5 OHLCV は更新していなかった)
#
# 2026-08-27 修正 (OBS000009 不具合2): 従来は data/curated/ds-1-forward.json
# (.gitignore 対象) に「追記マージ」する設計だったが、GitHub Actions のランナーは
# 実行ごとにまっさらな環境のため、実行間で一切永続していなかった(cutoff以降の
# データが実質「直近2日分のローリング窓」でしか蓄積されず、2026-08-19の
# N_BREAKOUTイベント3件を取りこぼしていたことが判明)。
# 永続先を data/raw/ds-1-forward/*.csv (git管理、ds-1と同じCSVスキーマ) に変更し、
# 本 workflow で commit/push するよう修正。

on:
  schedule:
    # 毎時 5 分 (rate limit 余裕、Actions runner のジッタ吸収)
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # data/raw/ds-1-forward/*.csv の commit/push に必要

concurrency:
  group: update-ds1-forward
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout minmax-fx-day-trading-lab (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # GMOClient (src/minmax_fx_dt/data/gmo_fx_client.py) が `import requests` するため
        # pandas / numpy だけでなく requests も必要。ライブ ticker と同じ依存。
        run: pip install --no-cache-dir pandas numpy requests

      - name: Fetch M5 OHLCV (last 2 days) and merge into data/raw/ds-1-forward/*.csv
        # 過去 2 日分 (昨日 + 今日、土日も含む) を GMO API から取得。
        # 既存 raw CSV の最新バー timestamp 以降のみ追記 (重複排除込み)。
        run: |
          PYTHONPATH=src python3 scripts/live_monitor/fetch_m5_ohlcv.py --all-pairs --lookback-days 2

      - name: Print summary
        run: |
          python3 -c "
          import json
          with open('data/curated/ds-1-forward.json') as f:
              d = json.load(f)
          print('=== ds-1-forward.json summary (raw CSV から再構築、参考用) ===')
          print(f'generated_at: {d[\"generated_at\"]}')
          for pair, p in d.get('pairs', {}).items():
              print(f'  {pair:<8} n_bars={p[\"n_bars\"]:>5} end={p[\"end\"]}')"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ds-1-forward/
          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップ"
            exit 0
          fi
          git commit -m "SYS-FX012 forward M5 OHLCV: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::warning::git pull --rebase failed (conflict). Aborted. Will retry next scheduled run."
            exit 1
          fi
          git push origin main
