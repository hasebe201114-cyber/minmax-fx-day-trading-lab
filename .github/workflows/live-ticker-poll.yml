name: SYS-FX022 ライブ気配値記録

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-ticker-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Poll live ticker (認証不要の公開Ticker API)
        run: PYTHONPATH=src python3 scripts/live_monitor/poll_ticker.py

      - name: Install pandas for reconcile step
        run: pip install pandas numpy

      - name: Reconcile divergence (フォワードテスト台帳との突き合わせ)
        run: PYTHONPATH=src python3 scripts/live_monitor/reconcile_divergence.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/live-ticker/ research/method-notes/live_cost_divergence.json
          if git diff --cached --quiet; then
            echo "変更なし、コミットをスキップ"
          else
            git commit -m "ライブ気配値記録: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
